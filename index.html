<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
    <title>3D Card</title>
</head>

<body>
    <div class="parent">
        <div class="card">
            <div class="hud-container">
                <span class="hud-line"></span>
                <span class="hud-hex"></span>
                <span class="hud-scan"></span>
            </div>
            <div class="glass"></div>

            <div class="content">
                <span class="title">Gustavo // Dev</span>
                <span class="text">Software Developer | Codando o futuro, um commit por vez.
                    Apaixonado por código, futebol e animes.
                </span>
            </div>

            <div class="bottom">
                <div class="social-buttons-container">
                    <button class="social-button social-button1">
                        <i class="fa-brands fa-github icon"></i>
                    </button>
                    <button class="social-button social-button2">
                        <i class="fa-brands fa-x-twitter icon"></i>
                    </button>
                    <button class="social-button social-button3">
                        <i class="fa-solid fa-at icon"></i>
                    </button>
                </div>
                <div class="view-more">
                    <button class="view-more-button">View More</button>
                    <i class="fa-solid fa-angles-down icon"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
