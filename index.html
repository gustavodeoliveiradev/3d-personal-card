<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gustavo - Software Developer Portfolio Card">

    <!-- Preconnect para performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="styles.css">
    <title>GusDev // HUD Card</title>
</head>

<body>
    <main class="scene">
        <article class="hud-card" id="hudCard" data-tilt>
            <!-- Camada de Scanlines (estática) -->
            <div class="hud-card__scanlines" aria-hidden="true"></div>

            <!-- Scanner animado -->
            <div class="hud-card__scanner" aria-hidden="true"></div>

            <!-- Efeito de vidro -->
            <div class="hud-card__glass" aria-hidden="true"></div>

            <!-- Brilho dinâmico -->
            <div class="hud-card__glare" aria-hidden="true"></div>

            <!-- HUD Superior -->
            <header class="hud-card__header">
                <div class="hud-indicator">
                    <span class="hud-indicator__line"></span>
                    <span class="hud-indicator__text">SYS_ACTIVE // 092</span>
                </div>
            </header>

            <!-- Conteúdo Principal -->
            <section class="hud-card__content">
                <h1 class="hud-card__title" data-parallax="1.2">Gustavo // Dev</h1>
                <p class="hud-card__description" data-parallax="0.8">
                    Software Developer | Codando o futuro, um commit por vez.
                    Apaixonado por código, futebol e animes.
                </p>
            </section>

            <!-- Rodapé com Ações -->
            <footer class="hud-card__footer">
                <nav class="social-links" aria-label="Redes sociais">
                    <a href="https://github.com/gustavodeoliveiradev" target="_blank" rel="noopener noreferrer"
                        class="social-links__btn" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="https://x.com/GuOliverDev" target="_blank" rel="noopener noreferrer"
                        class="social-links__btn" aria-label="Twitter/X">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>
                    <a href="mailto:gustavodeoliveira.dev@gmail.com" class="social-links__btn" aria-label="Email">
                        <i class="fa-solid fa-at"></i>
                    </a>
                </nav>

                <button class="expand-btn" id="expandBtn" aria-expanded="false" aria-controls="extraContent">
                    <span class="expand-btn__text">View More</span>
                    <i class="fa-solid fa-angles-down expand-btn__icon" aria-hidden="true"></i>
                </button>
            </footer>

            <!-- Conteúdo Expandido -->
            <section class="hud-card__extra" id="extraContent" aria-hidden="true">
                <h2 class="skills__title">System Skills // Level</h2>
                <ul class="skills__list">
                    <li class="skill-item">
                        <div class="skill-item__info">
                            <span>React / Next.js</span>
                            <span>85%</span>
                        </div>
                        <div class="skill-item__bar">
                            <div class="skill-item__fill" style="--skill-level: 85%"></div>
                        </div>
                    </li>
                    <li class="skill-item">
                        <div class="skill-item__info">
                            <span>TypeScript</span>
                            <span>90%</span>
                        </div>
                        <div class="skill-item__bar">
                            <div class="skill-item__fill" style="--skill-level: 90%"></div>
                        </div>
                    </li>
                    <li class="skill-item">
                        <div class="skill-item__info">
                            <span>Node.js</span>
                            <span>80%</span>
                        </div>
                        <div class="skill-item__bar">
                            <div class="skill-item__fill" style="--skill-level: 80%"></div>
                        </div>
                    </li>
                </ul>
            </section>
        </article>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
